name: momentoboothcompanionapp
description: A new Flutter project.

publish_to: 'none'

version: 0.0.7+9

environment:
  sdk: '>=3.6.0'

dependencies:
  flutter: { sdk: flutter }

  # Communication
  mqtt5_client: 4.15.2

  # Models
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0
  fast_immutable_collections: 11.1.0

  # Rust bridge
  flutter_rust_bridge: 2.11.1
  rust_lib_momentoboothcompanionapp: { path: rust_builder }

  # UI
  widgetbook: 3.15.0
  widgetbook_annotation: 3.9.0
  mobx: 2.5.0
  flutter_mobx: 2.3.0
  go_router: 17.0.0
  fluent_ui: 4.13.0
  lottie: 3.3.2
  window_manager: 0.5.1

  # l10n
  flutter_localizations: { sdk: flutter }
  intl: 0.20.2

  # Misc
  get_it: 9.1.0
  synchronized: 3.4.0
  talker: 5.1.0
  meta: 1.17.0

dev_dependencies:
  # Code quality
  flutter_lints: 6.0.0
  integration_test: { sdk: flutter }

  # Models
  freezed: 3.2.3
  json_serializable: 6.11.2
  build_runner: 2.10.4

  # UI
  widgetbook_generator: 4.0.0-alpha.4
  mobx_codegen: 2.7.4

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
